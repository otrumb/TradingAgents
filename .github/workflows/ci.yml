name: CI

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-wheel install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "${{ runner.temp }}/wheels"
      - name: Install wheel with dependencies and verify packaged patterns
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -I -m pip install "${{ runner.temp }}"/wheels/*.whl
          "$smoke_dir/venv/bin/python" -I -m pip check
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I - <<'PY'
          import sys
          import sysconfig
          from importlib.metadata import distribution, version
          from importlib.resources import files
          from pathlib import Path

          import cli.main
          import ta_patterns
          import tradingagents
          from tradingagents.dataflows.crypto_pattern_catalog import load_pattern_catalog
          from tradingagents.dataflows.crypto_pattern_certification import (
              CertificationDigest,
              load_certification,
          )

          prefix = Path(sys.prefix).resolve()
          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          assert sys.prefix != sys.base_prefix, "smoke must run in clean venv"
          assert site_packages.is_relative_to(prefix), site_packages
          for module in (tradingagents, cli.main, ta_patterns):
              location = Path(module.__file__).resolve()
              assert location.is_relative_to(site_packages), location
              print(f"{module.__name__}: {location}")
          for name in ("tradingagents", "ta-patterns"):
              location = Path(distribution(name).locate_file("")).resolve()
              assert location.is_relative_to(site_packages), location
          assert version("ta-patterns") == ta_patterns.__version__ == "1.2.2"
          assets = files("tradingagents.dataflows").joinpath("catalogs")
          for name in (
              "classic-crypto-v1.json",
              "classic-crypto-v1-certification.json",
              "classic-crypto-v1-certification-digest.json",
          ):
              assert assets.joinpath(name).is_file(), name
          catalog = load_pattern_catalog()
          certification = load_certification()
          digest = CertificationDigest.model_validate_json(
              assets.joinpath("classic-crypto-v1-certification-digest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert len(catalog.entries) == len(certification.entries) == 300
          assert catalog.package_version == certification.package_version == "1.2.2"
          assert certification.digest == "sha256:" + digest.digest
          print("clean-wheel smoke OK: catalog 300/300, certification digest verified")
          PY

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .
